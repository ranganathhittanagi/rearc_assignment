resources:
  jobs:
    rearc_ingestion_job:
      name: rearc_ingestion_job
      tasks:
        - task_key: ingest_sources
          spark_python_task:
            python_file: ../../src/rearc_pipeline/ingestion/job.py
            parameters:
              - "--volume_path=${var.volume_path}"
              - "--contact_email=${var.contact_email}"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - requests
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: UTC
        pause_status: PAUSED
